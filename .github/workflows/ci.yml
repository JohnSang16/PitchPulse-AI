name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Test — runs on pull requests only, not on push to main
  # ─────────────────────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # 2. Deploy to Elastic Beanstalk — runs on push to main only
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package application
        run: |
          cd backend
          # Use find to build the file list explicitly — avoids zip's
          # shallow --exclude patterns missing nested venv/pycache paths
          find . \
            -not -path "./venv/*" \
            -not -path "./.git/*" \
            -not -path "./__pycache__/*" \
            -not -path "*/__pycache__/*" \
            -not -path "./backend/*" \
            -not -name "*.pyc" \
            -not -name ".env" \
            -not -path "./tests/*" \
            | zip ../deploy.zip -@
          echo "── deploy.zip size ──"
          du -sh ../deploy.zip

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: pitchpulse-backend
          environment_name: pitchpulse-backend-env
          region: us-east-1
          version_label: pitchpulse-${{ github.sha }}
          deployment_package: deploy.zip
          wait_for_environment_recovery: 120
